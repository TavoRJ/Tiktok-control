<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TavLive • Actualización en curso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.04) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #f8fafc;
        }

        .maintenance-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Badge de Estado */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #00f2fe;
            margin-bottom: 24px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Logo y Versión */
        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1;
        }

        .brand-title span {
            color: #00f2fe;
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 6px;
            margin-bottom: 28px;
        }

        /* Caja de Detalle */
        .info-panel {
            background: rgba(4, 7, 17, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 20px;
            width: 100%;
            margin-bottom: 28px;
        }

        .info-title {
            font-size: 14px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 6px;
        }

        .info-desc {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }

        /* Barra de Progreso Minimalista */
        .progress-section {
            width: 100%;
            margin-bottom: 28px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .progress-labels .percentage {
            color: #00f2fe;
            font-family: monospace;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 92%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #10b981);
            border-radius: 999px;
        }

        /* Botón de Acción */
        .btn-check {
            width: 100%;
            background: #ffffff;
            color: #030712;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }

        .btn-check:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #334155;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        
        <!-- Estado -->
        <div class="status-pill">
            <span class="pulse-dot"></span>
            Actualización del Sistema
        </div>

        <!-- Marca -->
        <h1 class="brand-title">Tav<span>Live</span></h1>
        <p class="brand-subtitle">Studio Engine • v1.5.2</p>

        <!-- Detalle -->
        <div class="info-panel">
            <h2 class="info-title">Optimizando Servidores y Audio</h2>
            <p class="info-desc">Estamos desplegando mejoras en la sincronización en vivo y estabilidad del motor de sonido.</p>
        </div>

        <!-- Progreso -->
        <div class="progress-section">
            <div class="progress-labels">
                <span>Despliegue</span>
                <span class="percentage">92%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- Botón -->
        <button class="btn-check" onclick="window.location.reload()">
            Comprobar Disponibilidad
        </button>

        <p class="footer-note">TavLive Core System • Acceso Restringido</p>

    </div>

</body>
</html>
