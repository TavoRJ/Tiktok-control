<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TavLive - Unified Widgets Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dynamic-widgets.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            background: transparent !important;
            overflow: hidden;
            position: relative;
        }

        /* Unified 9:16 overlay root container */
        #overlay-root {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            background: transparent !important;
            pointer-events: none;
            overflow: hidden;
        }

        /* Widget container wrapper inside overlay-root */
        .overlay-widget-container {
            position: absolute;
            width: max-content;
            height: max-content;
            background: transparent;
            pointer-events: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <main id="overlay-root"></main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/widgets-overlay.js"></script>
</body>
</html>
