<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tap Tap - Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-glass: rgba(10, 10, 12, 0.45);
            --border-color: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --accent-glow: rgba(0, 240, 255, 0.35);
            --accent-color: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Outfit', sans-serif;
        }

        .ranking-container {
            width: 100%;
            height: 100%;
            background: var(--bg-glass);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .ranking-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .ranking-header h2 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .rank-badge {
            font-size: 16px;
            font-weight: 900;
            width: 24px;
            text-align: center;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .nickname {
            font-weight: 800;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .username {
            font-size: 11px;
            color: var(--text-muted);
        }

        .score-value {
            font-weight: 900;
            font-size: 14px;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="ranking-container" id="main-container">
        <div class="ranking-header">
            <i data-lucide="heart" style="color: var(--accent-color);"></i>
            <h2 id="widget-title" class="widget-title-text">TOP TAP TAP</h2>
        </div>
        <div class="ranking-list" id="taps-list">
            <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px;">
                Esperando likes en este directo...
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const WIDGET_KEY = 'taps';
        const container = document.getElementById('main-container');

        socket.on('top_tappers_update', (users) => {
            renderTappers(users);
        });

        socket.on('chatbot_settings_updated', (config) => {
            applyGlobalStyles(config);
        });

        function applyGlobalStyles(config) {
            if (!config) return;
            const widgetCfg = (config.widgets && config.widgets[WIDGET_KEY]) || {};
            const styles = config.globalWidgetStyles || {};

            const borderColor = widgetCfg.borderColor || styles.borderColor || '#00f0ff';
            const bgHex = widgetCfg.bgColor || styles.bgColor || '#0f0a19';
            const bgOpacity = widgetCfg.bgOpacity !== undefined ? widgetCfg.bgOpacity : (styles.bgOpacity !== undefined ? styles.bgOpacity : 45);
            const opacity = bgOpacity / 100;
            const customTitle = widgetCfg.title;

            const root = document.documentElement;
            root.style.setProperty('--border-color', borderColor);
            root.style.setProperty('--accent-color', borderColor);

            if (opacity === 0) {
                container.style.setProperty('background', 'transparent', 'important');
                container.style.setProperty('border', 'none', 'important');
                container.style.setProperty('box-shadow', 'none', 'important');
                container.style.setProperty('backdrop-filter', 'none', 'important');
                container.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
            } else {
                container.style.setProperty('background', hexToRgba(bgHex, opacity), 'important');
                container.style.setProperty('border', `2px solid ${borderColor}`, 'important');
                container.style.setProperty('box-shadow', `0 10px 30px rgba(0, 0, 0, ${Math.min(0.35, opacity)})`, 'important');
                container.style.setProperty('backdrop-filter', 'blur(16px)', 'important');
                container.style.setProperty('-webkit-backdrop-filter', 'blur(16px)', 'important');
            }

            if (customTitle && customTitle.trim()) {
                document.getElementById('widget-title').innerText = customTitle.trim();
            }
        }

        function hexToRgba(hex, alpha) {
            if (!hex) return `rgba(15, 10, 25, ${alpha})`;
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const num = parseInt(hex, 16);
            return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        }

        function renderTappers(users) {
            const listContainer = document.getElementById('taps-list');
            if (!users || users.length === 0) return;
            listContainer.innerHTML = '';
            users.slice(0, 5).forEach((user, index) => {
                const item = document.createElement('div');
                item.className = `ranking-item rank-${index + 1}`;
                let medalEmoji = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
                item.innerHTML = `
                    <div class="rank-badge">${medalEmoji}</div>
                    <div class="user-info">
                        <span class="nickname">${escapeHtml(user.nickname || user.username)}</span>
                        <span class="username">@${escapeHtml(user.username)}</span>
                    </div>
                    <div class="score-value">${user.count.toLocaleString()}</div>
                `;
                listContainer.appendChild(item);
            });
            lucide.createIcons();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        socket.emit('get_chatbot_settings');
        lucide.createIcons();
    </script>
</body>
</html>
