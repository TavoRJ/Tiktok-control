<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP - Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: transparent !important; font-family: 'Outfit', sans-serif; }
        .widget-card {
            width: 100%; height: 100%; background: transparent; border: 2px solid #00f0ff; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; transition: all 0.3s ease;
        }
        .widget-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .widget-header h2 { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #ffffff; }
        .widget-body { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
        .mvp-name { font-size: 18px; font-weight: 900; color: #ffffff; }
        .mvp-score { font-size: 14px; font-weight: 800; color: #00f0ff; }
    </style>
</head>
<body>
    <div class="widget-card" id="main-container">
        <div class="widget-header">
            <i data-lucide="crown" style="color: inherit;"></i>
            <h2 id="widget-title">MVP DEL DIRECTO</h2>
        </div>
        <div class="widget-body" id="mvp-body">
            <div style="color: rgba(255,255,255,0.6); font-size: 12px;">Sin MVP aún</div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const WIDGET_KEY = 'mvp';
        const container = document.getElementById('main-container');
        socket.on('mvp_update', (user) => { render(user); });
        socket.on('chatbot_settings_updated', (config) => { applyGlobalStyles(config); });

        function applyGlobalStyles(config) {
            if (!config) return;
            const widgetCfg = (config.widgets && config.widgets[WIDGET_KEY]) || {};
            const styles = config.globalWidgetStyles || {};
            const borderColor = widgetCfg.borderColor || styles.borderColor || '#00f0ff';
            const bgHex = widgetCfg.bgColor || styles.bgColor || '#0f0a19';
            const bgOpacity = widgetCfg.bgOpacity !== undefined ? widgetCfg.bgOpacity : 0;
            const opacity = bgOpacity / 100;
            const customTitle = widgetCfg.title;

            container.style.setProperty('border-color', borderColor, 'important');
            container.style.color = borderColor;

            if (opacity === 0) {
                container.style.setProperty('background', 'transparent', 'important');
                container.style.setProperty('box-shadow', 'none', 'important');
                container.style.setProperty('backdrop-filter', 'none', 'important');
            } else {
                container.style.setProperty('background', hexToRgba(bgHex, opacity), 'important');
                container.style.setProperty('box-shadow', `0 10px 30px rgba(0, 0, 0, ${Math.min(0.35, opacity)})`, 'important');
                container.style.setProperty('backdrop-filter', 'blur(16px)', 'important');
            }
            if (customTitle && customTitle.trim()) { document.getElementById('widget-title').innerText = customTitle.trim(); }
        }

        function hexToRgba(hex, alpha) {
            if (!hex) return `rgba(15, 10, 25, ${alpha})`;
            hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const num = parseInt(hex, 16); return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        }

        function render(user) {
            const body = document.getElementById('mvp-body');
            if (!user) return;
            body.innerHTML = `
                <div class="mvp-name">👑 ${user.nickname || user.username}</div>
                <div class="mvp-score">${(user.coins || 0).toLocaleString()} Monedas</div>
            `;
        }
        socket.emit('get_chatbot_settings');
        lucide.createIcons();
    </script>
</body>
</html>
