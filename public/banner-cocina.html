<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Superior</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script>
        if (window.self !== window.top) {
            document.documentElement.classList.add('is-iframe');
        }
    </script>
    <style>
        :root {
            --coquette-pink-light: #fff0f3;
            --coquette-pink-mid: #ffccd5;
            --coquette-pink-accent: #ff0077;
            --coquette-pink-dark: #ff0077;
            --coquette-text: #ffffff;
            --border-glow: rgba(255, 0, 119, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            top: 0;
        }

        html.is-iframe body {
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            position: relative !important;
            display: flex !important;
        }

        .banner-container {
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 15, 0.45);
            border-bottom: 2px solid var(--coquette-pink-accent);
            border-radius: 0 0 25px 25px; /* Estilo marquesina con bordes inferiores curvos */
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(8px);
            padding: 0 35px;
            overflow: hidden;
            animation: pastel-sparkle 3s ease-in-out infinite;
        }

        @keyframes pastel-sparkle {
            0% {
                border-color: var(--coquette-pink-accent);
            }
            50% {
                border-color: #ff55a5;
            }
            100% {
                border-color: var(--coquette-pink-accent);
            }
        }

        /* Center content */
        .banner-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            overflow: hidden;
        }

        #banner-text {
            color: var(--coquette-text);
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            opacity: 1;
            transform: translateX(0);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        #banner-text em {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--coquette-pink-dark);
            font-weight: 700;
        }

        /* Dynamic Progress Bar */
        .progress-bar-container {
            width: calc(100% + 70px);
            margin-left: -35px;
            height: 5px;
            background: rgba(255, 204, 213, 0.4);
            overflow: hidden;
            position: relative;
            border-radius: 0 0 50px 50px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--coquette-pink-accent), var(--coquette-pink-dark));
            box-shadow: 0 0 8px var(--coquette-pink-dark);
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.45) 50%,
                rgba(255,255,255,0) 100%
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Responsiveness for different canvas heights */
        @media (max-height: 80px) {
            #banner-text {
                font-size: 1.1rem;
            }
            .kitchen-icon {
                width: 22px;
                height: 22px;
            }
            .banner-container::before, .banner-container::after {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="banner-content">
            <div id="banner-text">
                <span id="banner-text-inner">Cargando evento...</span>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Dynamic slides configured from Settings
        let bannerSlides = [
            "Ejemplo de texto",
            "¡Pide tu canción en el chat usando <em>!song</em>! 🎵",
            "Deja tu Quiereme"
        ];
        let currentSlide = 0;
        let slideInterval = null;
        let rotationSpeed = 8; // seconds

        function applyBannerSettings(settings) {
            if (!settings) return;
            
            const container = document.querySelector('.banner-container');
            const textEl = document.getElementById('banner-text');
            
            if (container) {
                // Let it occupy 100% of the positioned body
                container.style.width = '100%';
                container.style.height = '100%';
                
                // Border styles
                if (settings.borderStyle === 'none') {
                    container.style.border = 'none';
                    container.style.animation = 'none';
                } else {
                    container.style.border = `${settings.borderWidth || '2px'} ${settings.borderStyle || 'solid'} ${settings.borderColor || '#ff0077'}`;
                    container.style.animation = 'none'; // Disable keyframe color override
                }
                container.style.borderRadius = settings.borderRadius || '25px';
                
                // Background color & opacity
                const bgColor = settings.backgroundColor || '#140a0f';
                const opacity = settings.backgroundOpacity !== undefined ? settings.backgroundOpacity : 45;
                container.style.backgroundColor = hexToRgba(bgColor, opacity / 100);
            }
            
            if (textEl) {
                textEl.style.fontFamily = `'${settings.fontFamily || 'Outfit'}', sans-serif`;
                textEl.style.fontSize = settings.fontSize || '24px';
                textEl.style.color = settings.fontColor || '#ffffff';
            }
            
            // Set slides
            if (settings.slides && settings.slides.length > 0) {
                bannerSlides = settings.slides;
            } else {
                bannerSlides = [
                    "Ejemplo de texto",
                    "¡Pide tu canción en el chat usando !song! 🎵",
                    "Deja tu Quiereme"
                ];
            }
            
            // Re-initialize slideshow interval if speed changed or interval not started
            const newSpeed = settings.rotationSpeed || 8;
            if (newSpeed !== rotationSpeed || !slideInterval) {
                rotationSpeed = newSpeed;
                if (slideInterval) clearInterval(slideInterval);
                slideInterval = setInterval(updateText, rotationSpeed * 1000);
            }
            
            // If current slide index is out of bounds, reset
            if (currentSlide >= bannerSlides.length) {
                currentSlide = 0;
            }
        }
        
        function hexToRgba(hex, alpha) {
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex.split('').map(char => char + char).join('');
            }
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateText() {
            const textEl = document.getElementById('banner-text');
            const innerEl = document.getElementById('banner-text-inner');
            if (!textEl || !innerEl) return;

            // Slide out to the left
            textEl.style.opacity = '0';
            textEl.style.transform = 'translateX(-50px)';
            
            setTimeout(() => {
                let content = bannerSlides[currentSlide] || '';
                innerEl.innerHTML = content;
                
                // Instantly place it to the right
                textEl.style.transition = 'none';
                textEl.style.transform = 'translateX(50px)';
                
                // Force layout reflow
                textEl.offsetHeight;
                
                // Slide in to center
                textEl.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease';
                textEl.style.opacity = '1';
                textEl.style.transform = 'translateX(0)';
                
                currentSlide = (currentSlide + 1) % bannerSlides.length;
            }, 500);
        }

        // Handle settings & goals sockets
        socket.on('chatbot_settings_updated', (config) => {
            if (config) {
                if (config.bannerSettings) {
                    applyBannerSettings(config.bannerSettings);
                } else {
                    bannerSlides = [
                        config.bannerSlide1 || "Ejemplo de texto",
                        config.bannerSlide2 || "¡Pide tu canción en el chat usando !song! 🎵",
                        config.bannerSlide3 || "Meta de Regalos Activa (Calculada automáticamente)"
                    ];
                }
                
                // Sync initial body positioning
                if (config.widgets && config.widgets.banner) {
                    applyWidgetState(config.widgets.banner);
                }
            }
        });

        const isIframe = window.self !== window.top;

        // Widget coordinate shifts from Scene canvas
        socket.on('widget_position_changed', (data) => {
            if (data && data.widget === 'banner') {
                if (!isIframe) {
                    document.body.style.left = data.x + '%';
                    document.body.style.top  = data.y + '%';
                    if (data.width !== undefined) document.body.style.width = data.width + '%';
                    if (data.height !== undefined) document.body.style.height = data.height + '%';
                }
            }
        });

        socket.on('widget_status_changed', (data) => {
            if (data && data.widget === 'banner') {
                document.body.style.display = data.active ? '' : 'none';
            }
        });

        function applyWidgetState(cfg) {
            if (!cfg) return;
            if (isIframe) {
                document.body.style.position = 'relative';
                document.body.style.left = '0';
                document.body.style.top = '0';
                document.body.style.width = '100%';
                document.body.style.height = '100%';
                document.body.style.display = cfg.active ? '' : 'none';
            } else {
                document.body.style.position = 'absolute';
                document.body.style.left = cfg.x + '%';
                document.body.style.top  = cfg.y + '%';
                if (cfg.width !== undefined) document.body.style.width = cfg.width + '%';
                if (cfg.height !== undefined) document.body.style.height = cfg.height + '%';
                document.body.style.display = cfg.active ? '' : 'none';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize slideshow
        updateText();
        slideInterval = setInterval(updateText, rotationSpeed * 1000);
    </script>
</body>
</html>
