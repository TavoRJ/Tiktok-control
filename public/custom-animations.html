<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TavLive - Custom Animations Overlay</title>
    <link rel="stylesheet" href="css/overlay.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        #layer-front {
            z-index: 10;
        }

        .custom-anim-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .custom-anim-container video, 
        .custom-anim-container img {
            width: 85%;
            max-width: 900px;
            max-height: 75vh;
            object-fit: contain;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
        }

        .custom-anim-text {
            color: white;
            font-size: 46px;
            font-weight: 900;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9), 0 0 25px rgba(0, 240, 255, 0.8);
            margin-top: 20px;
            text-transform: uppercase;
            word-break: break-word;
            max-width: 90%;
            line-height: 1.2;
            font-family: 'Inter', 'Outfit', sans-serif;
        }

        .fade-out-anim {
            animation: fadeOut 0.5s ease-in forwards !important;
        }

        @keyframes popIn {
            0% { transform: scale(0.5) translateY(100px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="layer-back" class="layer"></div>
    <div id="layer-front" class="layer"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/custom-animations.js"></script>
</body>
</html>
